{% load i18n %}
<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <title>
            {% block head_title %}
            {% endblock head_title %}
        </title>
        {% block extra_head %}
        {% endblock extra_head %}
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
            * {
                font-family: 'Montserrat', sans-serif;
            }
            .square-image {
                width: 300px;
                height: 40px;
                object-fit: cover;
                border-radius: 10px;
            }
            a {
                display: block;
                margin: 1rem;
            }
            button {
                margin-bottom: 2rem;
                display: inline-block;
                font-weight: 400;
                color: #fff;
                text-align: center;
                vertical-align: middle;
                user-select: none;
                background-color: #6c757d; /* Cor do botão secundário */
                border: 1px solid #6c757d; /* Borda do botão secundário */
                padding: 0.375rem 0.75rem;
                font-size: 1rem;
                line-height: 1.5;
                border-radius: 0.375rem;
                transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out, 
                            border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            }
            
            /* Estilo para hover */
            button:hover {
                color: #fff;
                background-color: #5c636a; /* Cor no hover */
                border-color: #565e64; /* Cor da borda no hover */
            }
            
            /* Estilo para foco */
            button:focus {
                color: #fff;
                background-color: #5c636a;
                border-color: #565e64;
                box-shadow: 0 0 0 0.25rem rgba(108, 117, 125, 0.5); /* Sombra de foco */
            }
            
            /* Estilo para botão desativado */
            button:disabled, button[disabled] {
                opacity: 0.65;
                cursor: not-allowed;
                background-color: #6c757d;
                border-color: #6c757d;
            }
            input {
                display: block;
                width: 100%;
                padding: 0.375rem 0.75rem;
                font-size: 1rem;
                font-weight: 400;
                line-height: 1.5;
                color: #495057; /* Cor do texto */
                background-color: #fff; /* Fundo do input */
                background-clip: padding-box;
                border: 1px solid #ced4da; /* Cor da borda */
                border-radius: 0.375rem;
                transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            }
            
            /* Estilo no foco */
            input:focus {
                color: #495057;
                background-color: #fff;
                border-color: #80bdff; /* Cor da borda ao focar */
                outline: 0;
                box-shadow: 0 0 0 0.25rem rgba(0, 123, 255, 0.25); /* Sombra ao focar */
            }
            
            /* Estilo para campo desabilitado */
            input:disabled {
                background-color: #e9ecef; /* Fundo para desabilitado */
                opacity: 1;
            }
            
            /* Estilo para campo de leitura */
            input[readonly] {
                background-color: #e9ecef; /* Fundo para somente leitura */
                opacity: 1;
            }
            
        </style>
    </head>
    <body>
        <div class="d-flex justify-content-center bg-dark">  
            <div class="p-5 rounded-3">
                <div class="d-flex justify-content-center mb-4">
                    <a href="{% url 'account_signup' %}">
                        <img src="https://meuslares.com.br/assets/meuslares-logo-coKkL2mS.png" class="square-image" alt="meuslares-logo">
                    </a>
                </div>
                <div class="bg-white p-5 rounded-3">
                    {% block body %}
                    {% block content %}
                    {% endblock content %}
                    {% endblock body %}
                    {% block extra_body %}
                    {% endblock extra_body %}
                </div>
            </div>
        </div>
    </body>
</html>
